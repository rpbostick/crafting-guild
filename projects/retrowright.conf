# Registered by ws init on 2026-10-10. Edit by hand; every key is read by scripts/lib.sh.
PROJECT_PATH="/home/patrickb/retrowright"
PROJECT_BRANCH="main"          # the branch builders branch from and merges land on
TEST_CMD="npm ci --silent --no-audit --no-fund && npm test && npm run build"   # run from the repo root; empty = no test gate
# Extra Bash grants for builders (Claude Code permission rules). Builders already get git add/commit/rm/mv,
# ls/cat/grep/head/tail/wc/diff/mkdir/chmod/expr/date, bash -n, git grep and the test command. Add what your tests and tools need.
EXTRA_TOOLS=("Bash(npm install *)" "Bash(npm ci *)" "Bash(npm run *)" "Bash(npm test*)" "Bash(npx *)" "Bash(node *)" "Bash(firefox --headless *)")
# Command that serves the app for a preview; {port} is replaced. Used by: ws serve <worktree|main> <port>
PREVIEW_CMD="RETROWRIGHT_TEST_ROMS=/home/patrickb/retrowright-test-roms npx vite --port {port} --strictPort --host 127.0.0.1"
