# Registered by ws init on 2026-10-09. Edit by hand; every key is read by scripts/lib.sh.
PROJECT_PATH="/home/patrickb/agentic-workspace-v2"
PROJECT_BRANCH="main"          # the branch builders branch from and merges land on
TEST_CMD="bash scripts/selftest.sh"   # run from the repo root; empty = no test gate
# Extra Bash grants for builders (Claude Code permission rules). Builders already get git add/commit/rm/mv,
# ls/cat/grep/head/tail/wc/diff/mkdir/chmod/expr/date, bash -n, git grep and the test command. Add what your tests and tools need.
EXTRA_TOOLS=()
# Command that serves the app for a preview; {port} is replaced. Used by: ws serve <worktree|main> <port>
PREVIEW_CMD=""
# Private files that hold the operator's own notes by design (never in RELEASE_PATHS): names and dates are expected there.
ATTRIBUTION_EXEMPT=("*.local.md" "**/*.local.md" "config.local.sh" "CHANGELOG.md" "plans/*" "reports/*" "projects/*.conf")
# Published as Crafting Guild. VERSION (read by `ws version` and by release.sh) and .claude/settings.json (the
# cold-start hook) go too, or the published tool cannot report its version or brief a session.
RELEASE_PATHS=("bin" "scripts" "agents" "schema" "checklist.md" "config.sh"
  "lessons/builder.md" "lessons/orchestrator.md" "lessons/reviewer.md"
  "CLAUDE.md" "MODIFYING.md" "README.md" "LICENSE" "release-audit.md"
  "projects/README.md" "projects/example.conf.sample" ".gitignore"
  "VERSION" ".claude/settings.json" "COMPARISON.md" "CHANGELOG.public.md=CHANGELOG.md")
