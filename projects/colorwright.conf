# Registered 2026-09-25. Edit by hand; every key is read by scripts/lib.sh.
PROJECT_PATH="/home/patrickb/colorwright"
PROJECT_BRANCH="master"          # the branch builders branch from and merges land on
TEST_CMD="bash scripts/run-all-tests.sh"   # run from the repo root; empty = no test gate
# Extra Bash grants for builders (Claude Code permission rules). Builders already get git add/commit/rm/mv,
# ls/cat/grep/head/tail/wc/diff/mkdir/chmod/expr/date and the test command. Add what your tests and tools need.
EXTRA_TOOLS=("Bash(backend/.venv/bin/python *)" "Bash(backend/.venv/bin/pytest *)" "Bash(pipeline/.venv/bin/python *)" "Bash(pipeline/.venv/bin/python3 *)" "Bash(pipeline/.venv/bin/pytest *)" "Bash(node *)" "Bash(npm test*)" "Bash(md5sum *)" "Bash(sha256sum *)")
# Command that serves the app for a preview; {port} is replaced. Used by: ws serve <worktree|main> <port>
PREVIEW_CMD="cd backend && .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port {port}"
