# Registered by ws init on 2026-10-02. Edit by hand; every key is read by scripts/lib.sh.
PROJECT_PATH="/home/patrickb/toybox"
PROJECT_BRANCH="main"          # the branch builders branch from and merges land on
TEST_CMD="npm ci --silent --no-audit --no-fund && bash build.sh && node --test"   # run from the repo root; empty = no test gate
# Extra Bash grants for builders (Claude Code permission rules). Builders already get git add/commit/rm/mv,
# ls/cat/grep/head/tail/wc/diff/mkdir/chmod/expr/date, bash -n, git grep and the test command. Add what your tests and tools need.
EXTRA_TOOLS=("Bash(npm install *)" "Bash(npm ci *)" "Bash(npx *)" "Bash(node *)" "Bash(bash build.sh*)" "Bash(bash scripts/*)" "Bash(cp *)" "Bash(git clone *)" "Bash(npm uninstall *)" "Bash(firefox --headless *)")
# Command that serves the app for a preview; {port} is replaced. Used by: ws serve <worktree|main> <port>
PREVIEW_CMD="python3 -m http.server {port} --bind 127.0.0.1 --directory dist"
# reactbits-kit (a git dependency) compiles itself in prepare, so merges allow install scripts.
MERGE_NPM_FLAGS=""
# `ws site`: after `ws release`, the release zip (without its README and CHANGELOG) is the site's /toybox/.
SITE_PROJECT="rpbostick-github-io"
SITE_SYNC=("release: public/toybox --exclude CHANGELOG.md --exclude README.md")
